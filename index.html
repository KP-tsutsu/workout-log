<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ワークアウト記録</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ワークアウト">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app" class="app" hidden>
  <header class="appbar">
    <div id="appbar-lead" class="appbar-lead"></div>
    <h1 id="appbar-title" class="appbar-title">ホーム</h1>
    <div id="appbar-actions" class="appbar-actions"></div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" role="tablist" aria-label="画面切り替え">
    <button class="tab" data-tab="dashboard" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg>
      <span>ホーム</span>
    </button>
    <button class="tab" data-tab="log" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H6a1 1 0 1 1 0-2h5V6a1 1 0 0 1 1-1Z"/></svg>
      <span>記録</span>
    </button>
    <button class="tab" data-tab="history" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1ZM5 9v10h14V9H5Z"/></svg>
      <span>履歴</span>
    </button>
    <button class="tab" data-tab="settings" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8.6 4a8.6 8.6 0 0 1-.1 1.2l2 1.6-2 3.4-2.4-1a8.5 8.5 0 0 1-2 1.2l-.4 2.6h-4l-.4-2.6a8.5 8.5 0 0 1-2-1.2l-2.4 1-2-3.4 2-1.6a8.6 8.6 0 0 1 0-2.4l-2-1.6 2-3.4 2.4 1a8.5 8.5 0 0 1 2-1.2L11.3 3h4l.4 2.6a8.5 8.5 0 0 1 2 1.2l2.4-1 2 3.4-2 1.6c.06.4.1.8.1 1.2Z"/></svg>
      <span>マスタ・設定</span>
    </button>
  </nav>
</div>

<div id="boot" class="boot">
  <div class="boot-spinner" aria-hidden="true"></div>
  <p id="boot-message">読み込み中…</p>
</div>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
